<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Link</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255,255,255,0.85);
      margin-bottom: 30px;
      font-size: 15px;
    }

    .open-btn {
      display: inline-block;
      padding: 16px 45px;
      color: white;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border-radius: 50px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(255,65,108,0.4);
      transition: 0.3s;
    }

    .open-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 30px rgba(255,65,108,0.55);
    }

    .open-btn:active {
      transform: scale(0.96);
    }

    .footer {
      margin-top: 25px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome 👋</h1>
    <p>Click the button below to open the link</p>

    <a
      class="open-btn"
      href="https://vplink.in/E5a9"
      target="_blank"
      rel="noopener noreferrer">
      OPEN LINK 🚀
    </a>

    <div class="footer">
      Tap the button to continue
    </div>
  </div>

</body>
</html>
